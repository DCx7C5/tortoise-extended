[project]
name = "tortoise-extended"
version = "0.1.0"
description = "Tortoise ORM extensions: pgvector, TimescaleDB, HNSW indexes, recursive CTEs, and Redis caching"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "tortoise-orm[asyncpg]>=1.1.7,<1.2",
    "tortoise-orm-stubs>=1.0.2",
    "pypika-tortoise>=0.6.5,<0.7",
    "msgspec>=0.21.0",
    "argon2-cffi>=25.1.0",
    "pglast>=8.9,<9",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["RUF002"]

[tool.basedpyright]
# Single source of truth for the type gate. A root `pyrightconfig.json` takes
# precedence over this block and is NOT merged with it, so the two files used to
# disagree silently — the JSON was merged in here and deleted (2026-11-22).
# Never re-add a root pyrightconfig.json.
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
stubPath = "src/tortoise_extended/stubs"

# `tests/` is intentionally NOT strict-type-gated (AGENTS.md §2) — pytest
# fixtures, test doubles and deliberate protected/monkey-patch access are harness
# looseness, not contract breaks.
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/.ai",
    "**/agents",
    "**/commands",
    "**/node_modules",
    "**/build",
    "**/dist",
    "**/.git",
    "**/*.md",
]

# --- errors ---
reportAttributeAccessIssue = "error"
reportUndefinedVariable = "error"
reportMissingImports = "error"
reportArgumentType = "error"
reportAssignmentType = "error"
reportReturnType = "error"
reportCallIssue = "error"
reportInvalidTypeForm = "error"
reportUnusedCoroutine = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalSubscript = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportIncompatibleMethodOverride = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportMatchNotExhaustive = "error"
reportAssertAlwaysTrue = "error"
reportUnreachable = "error"
reportMissingParameterType = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportInvalidCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportExplicitAny = "error"
reportDeprecated = "error"
reportInvalidAbstractMethod = "error"
reportMissingSuperCall = "error"

# --- warnings ---
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedParameter = "warning"
reportUnusedExpression = "warning"
reportUnusedCallResult = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportMissingModuleSource = "warning"
reportInvalidTypeVarUse = "warning"
reportSelfClsParameterName = "warning"
reportUnsupportedDunderAll = "warning"
reportWildcardImportFromLibrary = "warning"
reportConstantRedefinition = "warning"
reportDuplicateImport = "warning"
reportMissingTypeArgument = "warning"
reportPrivateUsage = "warning"
reportImplicitOverride = "warning"
reportUnsafeMultipleInheritance = "warning"

# --- none ---
reportImportCycles = "none"
reportIncompatibleVariableOverride = "none"
reportUninitializedInstanceVariable = "none"
reportAny = "none"
reportIncompleteStub = "none"
reportInvalidStubStatement = "none"
reportMissingTypeStubs = "none"
reportTypeCommentUsage = "none"
reportUntypedBaseClass = "none"
reportUntypedClassDecorator = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedNamedTuple = "none"
reportCallInDefaultInitializer = "none"
reportImplicitStringConcatenation = "none"

enableTypeIgnoreComments = false
strictListInference = false
strictDictionaryInference = false
strictSetInference = false

[tool.hatch.build.targets.wheel]
# `src/tortoise_extended` is the library itself. The `tortoise-orm` typing overlay
# lives under `src/tortoise_extended/stubs/tortoise-stubs/` and is DEV-ONLY: it is
# NOT shipped in the wheel. The strict type gate resolves `tortoise.*` by pointing
# `[tool.basedpyright] stubPath` at `src/tortoise_extended/stubs` (a `tortoise-stubs`
# package that merges onto `tortoise.*`), layered over the upstream `tortoise-orm-stubs`
# dependency. Consumers get correct `tortoise.*` typing from the upstream stubs +
# runtime; the local overlay only corrects specific typing gaps for this library's
# dev gate and stays out of the published artifact.
packages = ["src/tortoise_extended"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop per module so module-scoped Tortoise connections are
# not recreated per test (avoids TortoiseLoopSwitchWarning).
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Any warning outside the explicitly ignored upstream categories fails the run.
filterwarnings = ["error"]

# NOTE: coverage.py settings live in .coveragerc (PyCharm's coverage.py runner
# loads it from the project root; coverage consults only the first config file
# found, so pyproject.toml must not carry a second, divergent copy).

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    # ruff 0.16 changed the default rule set (RUF059/I001/PERF102…); pinning
    # <0.16 keeps the established gate until the codebase is migrated.
    "ruff>=0.15.0,<0.16",
    "basedpyright>=1.39.9",
]
