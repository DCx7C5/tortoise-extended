# =============================================================================
# Redis 7 Configuration — Development
# =============================================================================

# Network
# Use TCP so the container redis user never needs to bind a host-mounted
# unix socket (host dir is root-owned -> permission denied crash-loop).
# Compose maps 127.0.0.1:6380 -> 6379.
port 6379

protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec

# Logging
loglevel notice

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
