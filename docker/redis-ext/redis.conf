# =============================================================================
# Redis 7 Configuration — Development
# =============================================================================

# Network
port 0
unixsocket /var/run/redis/redis.sock
unixsocketperm 770

protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec

# Logging
loglevel notice

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
