name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check src tests benchmarks
      - name: Ruff format check
        run: uv run ruff format --check src tests benchmarks
      - name: Basedpyright
        run: uv run basedpyright

  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync
      - name: Run test suite
        run: uv run pytest tests/ -q

  integration:
    name: Tests (PostgreSQL docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - name: Create .env for docker compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=tortoise_test
          EOF
      - name: Start docker services
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 120); do
            if docker exec postgres-ext pg_isready -U postgres -d tortoise_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Sync dependencies
        run: uv sync
      - name: Run full test suite
        run: uv run pytest tests/ -q
      - name: Benchmark smoke
        run: uv run python benchmarks/bench_graph_traversal.py --rows 1000 --iterations 20 --output /tmp/bench.json
