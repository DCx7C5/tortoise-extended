name: publish-images

# Builds and publishes the postgres-ext and redis-ext dev images to GHCR.
# Packages pushed with GITHUB_TOKEN are linked to this repository and appear
# on the repo's Packages page (https://github.com/DCx7C5/tortoise-extended/pkgs).
#
# Pull with: docker pull ghcr.io/dcx7c5/tortoise-extended/postgres-ext:latest

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "docker-compose.dev.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # lowercase owner — GHCR rejects mixed-case image references
  IMAGE_BASE: ghcr.io/dcx7c5/tortoise-extended

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push postgres-ext
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres-ext
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/postgres-ext:latest
            ${{ env.IMAGE_BASE }}/postgres-ext:${{ github.sha }}

      - name: Build and push redis-ext
        uses: docker/build-push-action@v6
        with:
          context: docker/redis-ext
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/redis-ext:latest
            ${{ env.IMAGE_BASE }}/redis-ext:${{ github.sha }}
